name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: portal

env:
  NODE_VERSION: "20"

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: npm run lint

  unit-tests:
    name: Unit tests (takeoff calculations, coordinates, estimating math)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: npm run test:unit

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      # Placeholder values only — this build never runs against a real
      # backend and nothing here is deployed. Real secrets live in Vercel's
      # own env var config for actual deployments.
      - run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
          CLERK_SECRET_KEY: sk_test_placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          PYTHON_API_URL: https://placeholder.example.com
          ONYX_API_SECRET: placeholder
          GEMINI_API_KEY: placeholder
          GEMINI_MODEL: gemini-1.5-flash
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
          NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /dashboard
          NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /dashboard
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: placeholder
          NEXT_PUBLIC_GOOGLE_API_KEY: placeholder
          NEXT_PUBLIC_STORAGE_MODE: supabase

  launch-audit:
    name: Launch audit (repo config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: node scripts/launch-audit.mjs
        working-directory: portal

  launch-smoke:
    name: Launch smoke (production auth surface)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: node scripts/launch-smoke.mjs
        working-directory: portal

  migrations:
    name: Migration safety (apply all to a fresh local Supabase stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pin version: `latest` hits GitHub Releases rate limits and fails
          # setup before migrations ever run.
          version: 2.119.0
      # `supabase start` boots the full local stack (Postgres + the
      # auth/vault/pg_cron/pg_net extensions several of this repo's
      # migrations depend on) in Docker, then `db push` replays every
      # migration in supabase/migrations in order against it. This is the
      # actual safety gate: a migration that fails to apply cleanly — a
      # typo, a missing dependency, a broken ALTER against assumed prior
      # state — fails CI here instead of being discovered against the real
      # production database.
      - run: supabase start
        working-directory: portal
      - run: supabase db push --local
        working-directory: portal
      - run: supabase stop
        working-directory: portal
        if: always()

  python:
    name: Python takeoff engine (compile + tests)
    runs-on: ubuntu-latest
    # Lives at the repo root, not portal/ — overrides the global
    # working-directory default for its own steps.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile check (every root-level Python module)
        working-directory: .
        run: python -m py_compile takeoff_api.py takeoff_extract.py takeoff_parser.py takeoff_validator.py enhanced_takeoff_system.py google_integration.py rate_limiting.py cost_supabase.py
      - name: Run tests
        working-directory: .
        run: pytest -v

  integration-tests:
    name: Integration tests (tenant isolation, atomic writes, outbox worker)
    runs-on: ubuntu-latest
    # SAFETY: must target an ISOLATED Supabase branch / dedicated test
    # project only — never production. Uses TEST_SUPABASE_URL /
    # TEST_SUPABASE_SERVICE_ROLE_KEY repo secrets (distinct names from the
    # production NEXT_PUBLIC_SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY secrets
    # used by the build job) plus ALLOW_INTEGRATION_TESTS=true.
    # lib/test-utils/integration-guard.ts fails closed (throws, does not
    # skip) if TEST_SUPABASE_URL ever resolves to the production project ref,
    # so even a misconfigured secret can't point this job at production.
    # Every test file in this suite already skips itself gracefully and
    # reports "SKIPPED — ALLOW_INTEGRATION_TESTS is not set" if these secrets
    # aren't configured, so this job stays green before they're added — it
    # just isn't a real gate until they are.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - name: Require isolated test Supabase secrets
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$TEST_SUPABASE_URL" ] || [ -z "$TEST_SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::TEST_SUPABASE_URL / TEST_SUPABASE_SERVICE_ROLE_KEY are unset."
            echo "Integration tests will self-skip and this job will stay green without a real gate."
            echo "Add both Actions secrets pointing at an ISOLATED Supabase project (never production)."
            echo "missing=1" >> "$GITHUB_OUTPUT"
          else
            echo "missing=0" >> "$GITHUB_OUTPUT"
          fi
        id: secrets
      - run: npm run test:integration
        env:
          ALLOW_INTEGRATION_TESTS: "true"
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}

# Retrigger marker
