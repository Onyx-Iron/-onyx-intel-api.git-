[phases.setup]
nixPkgs = ["python312"]

[phases.install]
# Nixpacks runs `nix-collect-garbage -d` after setup, which can remove the
# python312Packages.pip store path. Bootstrap pip via ensurepip, then install.
cmds = [
  "python -m ensurepip --upgrade",
  "python -m pip install --upgrade pip",
  "python -m pip install -r requirements.txt",
  "python -m pip install -r requirements-docling.txt",
]

[start]
cmd = "uvicorn takeoff_api:app --host 0.0.0.0 --port $PORT --workers 2"
